name: Release

# Two kinds of release, one workflow:
#   - a tag vX.Y.Z creates the release of that version (never rewritten);
#   - a push to main rebuilds the rolling pre-release "latest" (the newest build).
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# One run at a time per ref. A newer push to main replaces the build in progress;
# a version tag is never cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  release-linux-amd64:
    name: Build and publish linux/amd64
    runs-on: ubuntu-latest
    # Releases are only built from main and from version tags, including manual runs.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check code
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -count=1 ./...

      - name: Define the version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
            echo "version=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"
          else
            echo "tag=latest" >> "${GITHUB_OUTPUT}"
            echo "version=latest" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build pve-console
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          COMMIT="${GITHUB_SHA}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build \
            -ldflags "-s -w -X pvc/internal/version.Version=${VERSION} -X pvc/internal/version.Commit=${COMMIT} -X pvc/internal/version.Date=${DATE}" \
            -o dist/pve-console_linux_amd64 \
            ./cmd/pvm
          file dist/pve-console_linux_amd64
          ./dist/pve-console_linux_amd64 version
          # The binary must carry the version of the tag, or the release would lie.
          ./dist/pve-console_linux_amd64 version | grep -F "pve-console ${VERSION} "
          (cd dist && sha256sum pve-console_linux_amd64 > SHA256SUMS && cat SHA256SUMS)

      - name: Publish the release of this version
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Notes: the section of CHANGELOG.md for this version.
          .github/scripts/changelog-section.sh "${TAG}" CHANGELOG.md > notes.md || true
          if [ ! -s notes.md ]; then
            echo "Automated linux/amd64 build of ${TAG}." > notes.md
          fi
          # A version with a suffix (v0.3.0-rc1) is a pre-release.
          PRERELEASE=""
          case "${TAG}" in
            *-*) PRERELEASE="--prerelease" ;;
          esac
          # Fails if the release already exists: a published version is never rewritten.
          gh release create "${TAG}" \
            dist/pve-console_linux_amd64 dist/SHA256SUMS \
            --verify-tag \
            --title "pve-console ${TAG}" \
            --notes-file notes.md \
            ${PRERELEASE}

      - name: Publish the rolling build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Automated linux/amd64 build of main (${GITHUB_SHA}). This is not a versioned release: see the releases page for the versions."
          # Delete and recreate, instead of updating in place: GitHub shows the date a
          # release was created, so an updated release would keep an old date.
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest \
            dist/pve-console_linux_amd64 dist/SHA256SUMS \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "Latest build (main)" \
            --notes "${NOTES}"
