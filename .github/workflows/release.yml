name: Release latest build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-linux-amd64:
    name: Build and publish linux/amd64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build pve-console
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p bin
          VERSION="latest"
          COMMIT="${GITHUB_SHA}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build \
            -ldflags "-s -w -X pvc/internal/version.Version=${VERSION} -X pvc/internal/version.Commit=${COMMIT} -X pvc/internal/version.Date=${DATE}" \
            -o bin/pve-console \
            ./cmd/pvm
          file bin/pve-console
          ./bin/pve-console version

      - name: Move latest tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "${GITHUB_SHA}"
          git push origin -f refs/tags/latest

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Automated linux/amd64 build from ${GITHUB_SHA}."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest bin/pve-console --clobber
            gh release edit latest --title "Latest pve-console build" --notes "${NOTES}" --latest
          else
            gh release create latest bin/pve-console --title "Latest pve-console build" --notes "${NOTES}" --latest
          fi