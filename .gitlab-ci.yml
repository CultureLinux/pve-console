stages:
  - test
  - build
  - deploy
  - publish

default:
  tags:
    - vm3
  before_script:
    - go version
    - make --version

variables:
  GOFLAGS: "-mod=readonly"

test:
  stage: test
  script:
    - make fmt
    - git diff --exit-code
    - make test
    - make vet

build:linux-amd64:
  stage: build
  script:
    - make clean
    - make build VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}" COMMIT="$CI_COMMIT_SHORT_SHA" DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
    - file bin/pve-console
    - ./bin/pve-console version
  artifacts:
    name: "pve-console-${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - bin/pve-console
    expire_in: 30 days

deploy:proxmox:
  stage: deploy
  needs:
    - job: build:linux-amd64
      artifacts: true
  script:
    - scp -o StrictHostKeyChecking=accept-new bin/pve-console root@192.168.1.51:/tmp/pve-console
    - ssh -o StrictHostKeyChecking=accept-new root@192.168.1.51 'install -o root -g root -m 0755 /tmp/pve-console /usr/local/sbin/pve-console && rm -f /tmp/pve-console && /usr/local/sbin/pve-console version'
  #when: manual

publish:github:
  stage: publish
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - when: never
  before_script:
    - git --version
  script:
    - test -n "$GITHUB_REPO_SSH"
    - ssh -T git@github.com || true
    - git fetch origin public
    - test -z "$(git ls-tree -r --name-only origin/public -- .gitlab-ci.yml copilot)"
    - git push "$GITHUB_REPO_SSH" "origin/public:refs/heads/main"