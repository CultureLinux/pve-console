stages:
  - test
  - build

default:
  tags:
    - vm3
  before_script:
    - go version
    - make --version

variables:
  GOFLAGS: "-mod=readonly"

test:
  stage: test
  script:
    - make fmt
    - git diff --exit-code
    - make test
    - make vet

build:linux-amd64:
  stage: build
  script:
    - make clean
    - make build VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}" COMMIT="$CI_COMMIT_SHORT_SHA" DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
    - file bin/pvm
    - ./bin/pvm version
  artifacts:
    name: "pvm-${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - bin/pvm
    expire_in: 30 days
